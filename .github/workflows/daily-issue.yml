name: Daily Issue

# Composes an issue on publishing days and pushes it straight to main.
# Validation runs first, so a bad issue fails the job instead of going live.
#
# To go back to review-before-publish, see README.md ("Switching to auto-publish")
# and restore the `gh pr create` step from git history.

on:
  schedule:
    # Publishing days: Mon, Wed, Fri, Sat.
    #
    # 11:17 UTC = 4:17am US Pacific — the main slot.
    - cron: "17 11 * * 1,3,5,6"
    # 15:47 UTC = 8:47am US Pacific — catch-up slot.
    #
    # GitHub drops scheduled runs under load; this has already happened here
    # (30 Aug 2026 produced no scheduled run at all). There is no "already
    # published today" check anymore — see the meta step below — so on a day
    # when the morning slot DID fire, this slot just produces a second issue.
    # That's an accepted trade-off: reliably catching a dropped morning run
    # matters more than capping issues at one per day.
    - cron: "47 15 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD). Defaults to today (UTC)."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out today's date
        id: meta
        run: |
          set -euo pipefail
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(date -u +%F)"; fi
          if ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid date: $DATE"; exit 1
          fi

          # No existence check and no issue number here anymore. Both used to
          # be keyed on the date, which is what made every run in this repo's
          # history vulnerable to the same class of bug: composing takes ~10
          # minutes, so anything decided about "today's file" up front is
          # stale by the time Publish actually runs. The issue number is now
          # assigned fresh inside Publish's retry loop, right after that
          # attempt's own git fetch — see scripts/finalize-issue.js for why.
          # Multiple issues on the same calendar date are fine; nothing here
          # or downstream treats the date as a uniqueness key anymore.
          mkdir -p issues
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Composing an issue dated $DATE"

      # Publications used recently, so the prompt can steer away from them.
      # Without this the model only ever sees today's rules and happily picks
      # Highsnobiety for the fourth issue running.
      # Kept for the log only: the composer enforces rotation itself, in
      # code, before the model ever sees a candidate.
      - name: Show which publications are rested
        id: rest
        if: success()
        run: |
          set -euo pipefail
          {
            echo 'list<<RECENT_EOF'
            node scripts/recent-sources.js
            echo 'RECENT_EOF'
          } >> "$GITHUB_OUTPUT"
          node scripts/recent-sources.js

      # Claude's ONLY job is to write one JSON file. It does not touch HTML,
      # git, or the push — those are deterministic steps below. That keeps the
      # design stable and the blast radius small.
      # Tests gate the run. They are pure and offline — a few seconds — and
      # they have already caught two real defects that would otherwise have
      # surfaced as a failed or wrong issue: escaped HTML surviving into
      # summaries, and validate.js rejecting the composer's own output.
      - name: Test
        if: success()
        run: |
          node scripts/test-feed-lib.js
          node scripts/test-compose.js
          node scripts/test-integration.js

      # Composes from RSS/Atom feeds. One API call over titles and excerpts
      # only; no article is fetched, so nothing accumulates in context. The
      # agentic loop this replaced cost $9.53 and 231 turns per issue.
      - name: Compose the issue
        if: success()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/compose-from-feeds.js --date "${{ steps.meta.outputs.date }}"

      - name: Show what was written
        if: always()
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- issues/ ---"
          ls -la issues/ || echo "(no issues dir)"

      - name: Validate
        if: success()
        run: node scripts/validate.js issues/_draft.json

      - name: Publish
        if: success()
        env:
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name  "algorithm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f "issues/_draft.json" ]; then
            echo "::error::Nothing was generated — issues/_draft.json is missing."
            exit 1
          fi

          # Park the draft. Everything else on the site is a pure function of
          # issues/*.json, so it can be rebuilt at will — which is what makes
          # the retry below safe.
          #
          # The issue number is deliberately decided INSIDE the loop, fresh on
          # every attempt, never up front. Composing takes ~10 minutes, so any
          # number — or any "does this already exist" check — decided before
          # that is answering about a `main` that no longer exists by the time
          # this step runs. The previous version of this check tested whether
          # issues/<DATE>.json existed on the local filesystem after resetting
          # to origin/main, which sounds safe but isn't: that file is this
          # run's OWN draft, still sitting there because `git reset --hard`
          # never touches untracked files. The check found its own draft on
          # every attempt and concluded, wrongly, every single time, that
          # another run had already published — which is why no scheduled or
          # manual run actually published anything from 2 Sept until this fix.
          # See scripts/finalize-issue.js for the full account.
          #
          # The only check that can't produce a false positive here is `git
          # push` itself, so that's what this now relies on.
          cp "issues/_draft.json" "${RUNNER_TEMP}/draft.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p issues
            COUNT=$(find issues -maxdepth 1 -name '[0-9][0-9][0-9][0-9].json' -type f | wc -l | tr -d ' ')
            NEXT=$((COUNT + 1))
            NUM=$(printf '%04d' "$NEXT")

            node scripts/finalize-issue.js "${RUNNER_TEMP}/draft.json" "$NEXT" "issues/${NUM}.json"
            rm -f issues/_draft.json

            node scripts/build.js
            git add -A

            if git diff --cached --quiet; then
              echo "::error::Build produced no changes."; exit 1
            fi

            git commit -m "Issue No. ${NEXT} — ${DATE}"

            if git push origin HEAD:main; then
              echo "Published Issue No. ${NEXT} on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/5) — main moved. Renumbering and rebuilding on top of it."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1
