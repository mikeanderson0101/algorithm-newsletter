name: Daily Issue

# Composes an issue on publishing days and pushes it straight to main.
# Validation runs first, so a bad issue fails the job instead of going live.
#
# To go back to review-before-publish, see README.md ("Switching to auto-publish")
# and restore the `gh pr create` step from git history.

on:
  schedule:
    # Publishing days: Mon, Wed, Fri, Sat.
    #
    # 11:17 UTC = 4:17am US Pacific — the main slot.
    - cron: "17 11 * * 1,3,5,6"
    # 15:47 UTC = 8:47am US Pacific — catch-up slot.
    #
    # GitHub drops scheduled runs under load; this has already happened here
    # (30 Aug 2026 produced no scheduled run at all). There is no "already
    # published today" check anymore — see the meta step below — so on a day
    # when the morning slot DID fire, this slot just produces a second issue.
    # That's an accepted trade-off: reliably catching a dropped morning run
    # matters more than capping issues at one per day.
    - cron: "47 15 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD). Defaults to today (UTC)."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out today's date
        id: meta
        run: |
          set -euo pipefail
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(date -u +%F)"; fi
          if ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid date: $DATE"; exit 1
          fi

          # No existence check and no issue number here anymore. Both used to
          # be keyed on the date, which is what made every run in this repo's
          # history vulnerable to the same class of bug: composing takes ~10
          # minutes, so anything decided about "today's file" up front is
          # stale by the time Publish actually runs. The issue number is now
          # assigned fresh inside Publish's retry loop, right after that
          # attempt's own git fetch — see scripts/finalize-issue.js for why.
          # Multiple issues on the same calendar date are fine; nothing here
          # or downstream treats the date as a uniqueness key anymore.
          mkdir -p issues
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Composing an issue dated $DATE"

      # Publications used recently, so the prompt can steer away from them.
      # Without this the model only ever sees today's rules and happily picks
      # Highsnobiety for the fourth issue running.
      - name: Work out which publications to rest
        id: rest
        if: success()
        run: |
          set -euo pipefail
          {
            echo 'list<<RECENT_EOF'
            node scripts/recent-sources.js
            echo 'RECENT_EOF'
          } >> "$GITHUB_OUTPUT"
          node scripts/recent-sources.js

      # Claude's ONLY job is to write one JSON file. It does not touch HTML,
      # git, or the push — those are deterministic steps below. That keeps the
      # design stable and the blast radius small.
      - name: Research and compose the issue
        if: success()
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "WebSearch,WebFetch,Read,Write,Glob,Grep"
            --max-turns 600
          prompt: |
            Compose today's issue of Algorithm, a culture newsletter.

            Write exactly ONE file: `issues/_draft.json`
            Do not create, edit, or delete any other file. Do not run git.

            ## Before you start, read these

            1. `sources.md` — the curated source list. Check these publications
               FIRST. They are the spine of the newsletter.
            2. `assets/search-index.json` — every article ever featured. You must
               not repeat any of them. If the file does not exist, this is issue 1.

            ## What to find

            Two pieces in each of seven categories, in this order:
            art, film, tech, lit, music, design, fashion.

            - art — fine art, leaning contemporary
            - film — critical essays, not consumer reviews
            - tech — general tech and AI coverage, not just entertainment
            - lit — literary reviews, leaning sci-fi/fantasy
            - music — album/artist analysis, not chart news
            - design — graphic, interior, or industrial design
            - fashion — men's fashion, critical/analytical, not shopping guides

            Published within the last 3 weeks. Favour depth: no listicles, no
            press releases, no breaking-news wires. Prefer independent and
            specialist publications over major aggregators unless a piece is
            genuinely exceptional.

            ## Publications to rest — and publications to prefer

            The first list below has run recently. Treat those as unavailable
            today and go further down the source list instead. Only reach for
            one of these if you have genuinely exhausted the alternatives in
            `sources.md` for that category — and never for both entries in a
            category.

            The second list, where present, names verified outlets that have
            NEVER been used in any issue published so far. This is not a
            rejected or unreliable list — every name in it passed the same
            fetch-and-confirm check as everything else in `sources.md`. Being
            below the rotation limit is not the same as being a good pick:
            issues 1-4 show a category can stay technically compliant while
            still drawing from only 3-5 outlets out of 15-20 available, simply
            because the same familiar few get reached for every time. When a
            category has a non-empty second list, treat it as the FIRST place
            to look, ahead of any outlet already used this issue-window, even
            one still below its limit.

            ${{ steps.rest.outputs.list }}

            Rotation is a real editorial requirement, not a preference. A reader
            who sees the same three or four mastheads every issue has no reason
            to trust that anything was actually curated. `sources.md` lists
            roughly 110 publications; a healthy issue reaches well past the
            obvious five — and an outlet sitting at zero uses after several
            issues is a stronger signal to reach for it than an outlet merely
            not yet at its limit.

            ## Rules that will fail the build if broken

            1. ENGLISH ONLY. The article must be published in English by the
               outlet itself. Never translate. Skip anything not in English.
            2. FETCH EVERY ARTICLE BEFORE WRITING ABOUT IT. Use WebFetch on the
               article's own URL and read it. Summaries must describe the actual
               argument, never what a headline implies. Set `"verified": true`
               only for articles you actually fetched and read. This is checked.
            3. EVERY URL MUST COME FROM A REAL SEARCH OR FETCH RESULT. Never
               construct a URL from a site's naming pattern. If you cannot get a
               working URL, set `"url": null` and cite the source by name.
            4. NO REPEATS. Nothing already in assets/search-index.json.
            5. NEVER TWO ENTRIES FROM THE SAME PUBLICATION IN ONE CATEGORY.
               The two picks in a category must come from two different outlets.
            6. AT MOST 2 ENTRIES PER PUBLICATION across the whole issue.
            7. NO PUBLICATION MAY APPEAR IN THREE OF ANY FOUR CONSECUTIVE ISSUES
               in the same category. The list above tells you which are at risk.
            8. AIM FOR GEOGRAPHIC SPREAD across the issue as a whole — sources
               from different continents, not seven UK outlets. Balance across
               the issue, not within every category.

            If you genuinely cannot fill a category to standard, still write the
            two best entries you verified rather than inventing anything.

            ## File format

            {
              "issue": 1,
              "date": "${{ steps.meta.outputs.date }}",
              "headline": "Three to six *words*",
              "intro": "2-3 sentence editorial intro to this issue.",
              "byline": "Issue No. N — short descriptor",
              "categories": [
                {
                  "key": "art",
                  "entries": [
                    {
                      "title": "Exact article title",
                      "author": "Author name",
                      "source": "Publication name",
                      "summary": "Two sentences on the actual argument.",
                      "why": "One sentence on why it is worth reading.",
                      "url": "https://...",
                      "verified": true
                    }
                  ]
                }
              ]
            }

            Notes on the format:
            - `issue` is a placeholder — write any positive integer. The real
              number is assigned automatically after this file is written, and
              whatever you put here is overwritten. Don't spend effort on it.
            - `headline` is a punchy 3-6 word tabloid-style cover line. Text
              wrapped in *asterisks* renders in red. Include one such phrase.
            - All seven category keys must be present, each with exactly 2 entries.
            - `url` may be null, but the key must exist.
            - There is no `pulse` field. The section was retired.

      - name: Show what was written
        if: always()
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- issues/ ---"
          ls -la issues/ || echo "(no issues dir)"

      - name: Validate
        if: success()
        run: node scripts/validate.js issues/_draft.json

      - name: Publish
        if: success()
        env:
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name  "algorithm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f "issues/_draft.json" ]; then
            echo "::error::Nothing was generated — issues/_draft.json is missing."
            exit 1
          fi

          # Park the draft. Everything else on the site is a pure function of
          # issues/*.json, so it can be rebuilt at will — which is what makes
          # the retry below safe.
          #
          # The issue number is deliberately decided INSIDE the loop, fresh on
          # every attempt, never up front. Composing takes ~10 minutes, so any
          # number — or any "does this already exist" check — decided before
          # that is answering about a `main` that no longer exists by the time
          # this step runs. The previous version of this check tested whether
          # issues/<DATE>.json existed on the local filesystem after resetting
          # to origin/main, which sounds safe but isn't: that file is this
          # run's OWN draft, still sitting there because `git reset --hard`
          # never touches untracked files. The check found its own draft on
          # every attempt and concluded, wrongly, every single time, that
          # another run had already published — which is why no scheduled or
          # manual run actually published anything from 2 Sept until this fix.
          # See scripts/finalize-issue.js for the full account.
          #
          # The only check that can't produce a false positive here is `git
          # push` itself, so that's what this now relies on.
          cp "issues/_draft.json" "${RUNNER_TEMP}/draft.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p issues
            COUNT=$(find issues -maxdepth 1 -name '[0-9][0-9][0-9][0-9].json' -type f | wc -l | tr -d ' ')
            NEXT=$((COUNT + 1))
            NUM=$(printf '%04d' "$NEXT")

            node scripts/finalize-issue.js "${RUNNER_TEMP}/draft.json" "$NEXT" "issues/${NUM}.json"
            rm -f issues/_draft.json

            node scripts/build.js
            git add -A

            if git diff --cached --quiet; then
              echo "::error::Build produced no changes."; exit 1
            fi

            git commit -m "Issue No. ${NEXT} — ${DATE}"

            if git push origin HEAD:main; then
              echo "Published Issue No. ${NEXT} on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/5) — main moved. Renumbering and rebuilding on top of it."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1
