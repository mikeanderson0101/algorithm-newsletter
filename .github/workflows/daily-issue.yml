name: Daily Issue

# Composes an issue on publishing days and pushes it straight to main.
# Validation runs first, so a bad issue fails the job instead of going live.
#
# To go back to review-before-publish, see README.md ("Switching to auto-publish")
# and restore the `gh pr create` step from git history.

on:
  schedule:
    # Publishing days: Mon, Wed, Fri, Sat.
    #
    # 11:17 UTC = 4:17am US Pacific — the main slot.
    - cron: "17 11 * * 1,3,5,6"
    # 15:47 UTC = 8:47am US Pacific — catch-up slot.
    #
    # GitHub drops scheduled runs under load; this has already happened here
    # (30 Aug 2026 produced no scheduled run at all). The catch-up costs
    # nothing on a normal day: if the morning slot already published, the
    # meta step below skips the whole job in about ten seconds.
    - cron: "47 15 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD). Defaults to today (UTC)."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out the date and issue number
        id: meta
        run: |
          set -euo pipefail
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE="$(date -u +%F)"; fi
          if ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid date: $DATE"; exit 1
          fi

          # An issue that already exists is a SUCCESSFUL no-op, not a failure.
          # The catch-up schedule relies on this: on a normal day it finds the
          # morning's issue here and stops. Failing instead would fill the
          # Actions log with red runs that are actually working as designed.
          if [ -f "issues/${DATE}.json" ]; then
            echo "issues/${DATE}.json already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # mkdir -p is required, not defensive: on a fresh repo issues/ may not
          # exist yet, and under `set -euo pipefail` a failing find kills the step.
          mkdir -p issues
          COUNT=$(find issues -name '*.json' -type f | wc -l | tr -d ' ')
          echo "skip=false"              >> "$GITHUB_OUTPUT"
          echo "date=$DATE"              >> "$GITHUB_OUTPUT"
          echo "issue=$((COUNT + 1))"    >> "$GITHUB_OUTPUT"
          echo "Composing issue #$((COUNT + 1)) for $DATE"

      # Publications used recently, so the prompt can steer away from them.
      # Without this the model only ever sees today's rules and happily picks
      # Highsnobiety for the fourth issue running.
      - name: Work out which publications to rest
        id: rest
        if: success() && steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          {
            echo 'list<<RECENT_EOF'
            node scripts/recent-sources.js
            echo 'RECENT_EOF'
          } >> "$GITHUB_OUTPUT"
          node scripts/recent-sources.js

      # Claude's ONLY job is to write one JSON file. It does not touch HTML,
      # git, or the push — those are deterministic steps below. That keeps the
      # design stable and the blast radius small.
      - name: Research and compose the issue
        if: success() && steps.meta.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "WebSearch,WebFetch,Read,Write,Glob,Grep"
            --max-turns 220
          prompt: |
            Compose today's issue of Algorithm, a culture newsletter.

            Write exactly ONE file: `issues/${{ steps.meta.outputs.date }}.json`
            Do not create, edit, or delete any other file. Do not run git.

            ## Before you start, read these

            1. `sources.md` — the curated source list. Check these publications
               FIRST. They are the spine of the newsletter.
            2. `assets/search-index.json` — every article ever featured. You must
               not repeat any of them. If the file does not exist, this is issue 1.

            ## What to find

            Two pieces in each of seven categories, in this order:
            art, film, tech, lit, music, design, fashion.

            - art — fine art, leaning contemporary
            - film — critical essays, not consumer reviews
            - tech — general tech and AI coverage, not just entertainment
            - lit — literary reviews, leaning sci-fi/fantasy
            - music — album/artist analysis, not chart news
            - design — graphic, interior, or industrial design
            - fashion — men's fashion, critical/analytical, not shopping guides

            Published within the last 3 weeks. Favour depth: no listicles, no
            press releases, no breaking-news wires. Prefer independent and
            specialist publications over major aggregators unless a piece is
            genuinely exceptional.

            ## Publications to rest this issue

            These have run recently. Treat them as unavailable today and go
            further down the source list instead. Only reach for one of these if
            you have genuinely exhausted the alternatives in `sources.md` for
            that category — and never for both entries in a category.

            ${{ steps.rest.outputs.list }}

            Rotation is a real editorial requirement, not a preference. A reader
            who sees the same three mastheads every issue has no reason to trust
            that anything was actually curated. `sources.md` lists roughly 110
            publications; a healthy issue reaches past the obvious five.

            ## Rules that will fail the build if broken

            1. ENGLISH ONLY. The article must be published in English by the
               outlet itself. Never translate. Skip anything not in English.
            2. FETCH EVERY ARTICLE BEFORE WRITING ABOUT IT. Use WebFetch on the
               article's own URL and read it. Summaries must describe the actual
               argument, never what a headline implies. Set `"verified": true`
               only for articles you actually fetched and read. This is checked.
            3. EVERY URL MUST COME FROM A REAL SEARCH OR FETCH RESULT. Never
               construct a URL from a site's naming pattern. If you cannot get a
               working URL, set `"url": null` and cite the source by name.
            4. NO REPEATS. Nothing already in assets/search-index.json.
            5. NEVER TWO ENTRIES FROM THE SAME PUBLICATION IN ONE CATEGORY.
               The two picks in a category must come from two different outlets.
            6. AT MOST 2 ENTRIES PER PUBLICATION across the whole issue.
            7. NO PUBLICATION MAY APPEAR IN THREE OF ANY FOUR CONSECUTIVE ISSUES
               in the same category. The list above tells you which are at risk.
            8. AIM FOR GEOGRAPHIC SPREAD across the issue as a whole — sources
               from different continents, not seven UK outlets. Balance across
               the issue, not within every category.

            If you genuinely cannot fill a category to standard, still write the
            two best entries you verified rather than inventing anything.

            ## File format

            {
              "issue": ${{ steps.meta.outputs.issue }},
              "date": "${{ steps.meta.outputs.date }}",
              "headline": "Three to six *words*",
              "intro": "2-3 sentence editorial intro to this issue.",
              "byline": "Issue No. N — short descriptor",
              "categories": [
                {
                  "key": "art",
                  "entries": [
                    {
                      "title": "Exact article title",
                      "author": "Author name",
                      "source": "Publication name",
                      "summary": "Two sentences on the actual argument.",
                      "why": "One sentence on why it is worth reading.",
                      "url": "https://...",
                      "verified": true
                    }
                  ]
                }
              ]
            }

            Notes on the format:
            - `headline` is a punchy 3-6 word tabloid-style cover line. Text
              wrapped in *asterisks* renders in red. Include one such phrase.
            - All seven category keys must be present, each with exactly 2 entries.
            - `url` may be null, but the key must exist.
            - There is no `pulse` field. The section was retired.

      - name: Validate
        if: success() && steps.meta.outputs.skip != 'true'
        run: node scripts/validate.js "${{ steps.meta.outputs.date }}.json"

      - name: Publish
        if: success() && steps.meta.outputs.skip != 'true'
        env:
          DATE: ${{ steps.meta.outputs.date }}
          ISSUE: ${{ steps.meta.outputs.issue }}
        run: |
          set -euo pipefail
          git config user.name  "algorithm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f "issues/${DATE}.json" ]; then
            echo "::error::Nothing was generated — issues/${DATE}.json is missing."
            exit 1
          fi

          # Park the one file the model produced. Everything else on the site is
          # a pure function of issues/*.json, so it can be rebuilt at will —
          # which is what makes the retry below safe.
          cp "issues/${DATE}.json" "${RUNNER_TEMP}/issue.json"

          # Why this loop exists: checkout pins main at the moment the run
          # starts, then research takes ten minutes. Anything that lands on main
          # in that window made the old single `git push` fail non-fast-forward,
          # and a finished issue was thrown away at the very last line. That is
          # exactly what killed the scheduled run on 29 Aug 2026.
          #
          # Each attempt rebuilds from whatever main looks like NOW, so there is
          # never a merge conflict to resolve.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ -f "issues/${DATE}.json" ]; then
              echo "issues/${DATE}.json is already on main — another run got there first."
              exit 0
            fi

            mkdir -p issues
            cp "${RUNNER_TEMP}/issue.json" "issues/${DATE}.json"
            node scripts/build.js
            git add -A

            if git diff --cached --quiet; then
              echo "::error::Build produced no changes."; exit 1
            fi

            git commit -m "Issue No. ${ISSUE} — ${DATE}"

            if git push origin HEAD:main; then
              echo "Published on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/5) — main moved. Rebuilding on top of it."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1
